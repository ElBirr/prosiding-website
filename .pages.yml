media:
  - name: article_pdfs
    label: Article PDFs
    input: files/pdf
    output: files/pdf
    extensions:
      - pdf
    rename: safe
  - name: images
    label: Images
    input: assets/images
    output: assets/images
    extensions:
      - png
      - jpg
      - jpeg
      - webp
      - svg

content:
  - name: articles
    label: Articles
    type: file
    path: data/articles.json
    format: json
    list: true
    fields:
      - name: id
        label: Article ID
        type: string
        required: true
      - name: title
        label: Article title
        type: string
        required: true
      - name: subtitle
        label: Subtitle
        type: string
      - name: authors
        label: Authors
        type: object
        list: true
        required: true
        fields:
          - name: name
            label: Name
            type: string
            required: true
          - name: affiliation
            label: Affiliation
            type: string
          - name: country
            label: Country
            type: string
          - name: orcid
            label: ORCID iD
            type: string
            description: ORCID iD only, for example 0000-0002-1825-0097.
          - name: email
            label: Email
            type: string
          - name: bio
            label: Biography
            type: text
            description: Shown in the Author Biographies section on the article page.
      - name: affiliations
        label: Affiliations
        type: string
      - name: year
        label: Publication year
        type: number
        required: true
      - name: event
        label: Proceedings / event
        type: string
      - name: issue_id
        label: Issue ID
        type: string
        description: Must match the id of an entry in Issues (for example proceedings-2026).
      - name: volume
        label: Volume
        type: string
      - name: issue
        label: Issue number
        type: string
      - name: pages
        label: Pages
        type: string
        description: Page range, for example 1-12.
      - name: doi
        label: DOI
        type: string
        description: DOI without the https://doi.org/ prefix.
      - name: publication_date
        label: Publication date
        type: date
      - name: language
        label: Language
        type: string
        description: Language of the article, for example en or id.
      - name: abstract
        label: Abstract
        type: text
        required: true
      - name: keywords
        label: Keywords
        type: string
        description: Comma-separated keywords.
      - name: pdf
        label: PDF file
        type: file
        required: true
        options:
          media: article_pdfs
          extensions:
            - pdf
      - name: published
        label: Published
        type: boolean

  - name: issues
    label: Issues
    type: file
    path: data/issues.json
    format: json
    list: true
    fields:
      - name: id
        label: Issue ID
        type: string
        required: true
        description: Stable identifier referenced by articles (for example proceedings-2026).
      - name: title
        label: Issue title
        type: string
        required: true
      - name: volume
        label: Volume
        type: string
      - name: issue
        label: Issue number
        type: string
      - name: year
        label: Year
        type: number
        required: true
      - name: publication_date
        label: Publication date
        type: date
      - name: description
        label: Description
        type: text
      - name: published
        label: Published
        type: boolean

  - name: site
    label: Site settings
    type: file
    path: data/site.json
    format: json
    fields:
      - name: site_name
        label: Site name
        type: string
      - name: short_name
        label: Short name
        type: string
      - name: institution
        label: Institution
        type: string
      - name: publisher
        label: Publisher
        type: string
      - name: description
        label: Site description
        type: text
      - name: base_url
        label: Base URL
        type: string
        description: Public site URL, including the trailing slash.
      - name: logo
        label: Logo
        type: image
        options:
          media: images
      - name: address
        label: Address
        type: text
      - name: contact_email
        label: Contact email
        type: string
      - name: contact_phone
        label: Contact phone
        type: string
      - name: website
        label: Website
        type: string
      - name: frequency
        label: Publication frequency
        type: string
      - name: open_access
        label: Open access statement
        type: text
      - name: default_language
        label: Default language
        type: select
        options:
          values:
            - id
            - en
      - name: additional_language
        label: Additional language
        type: select
        options:
          values:
            - id
            - en

  - name: editors
    label: Editorial team
    type: file
    path: data/editors.json
    format: json
    list: true
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: role
        label: Role
        type: select
        options:
          values:
            - editor-in-chief
            - managing-editor
            - editorial-board
      - name: affiliation
        label: Affiliation
        type: string
      - name: expertise
        label: Expertise
        type: string
      - name: email
        label: Email
        type: string
      - name: country
        label: Country
        type: string
      - name: orcid
        label: ORCID iD
        type: string
      - name: bio
        label: Biography
        type: text

  - name: reviewers
    label: Reviewers
    type: file
    path: data/reviewers.json
    format: json
    list: true
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: affiliation
        label: Affiliation
        type: string
      - name: expertise
        label: Expertise
        type: string
      - name: email
        label: Email
        type: string
      - name: country
        label: Country
        type: string
      - name: orcid
        label: ORCID iD
        type: string
      - name: bio
        label: Biography
        type: text

  - name: page_about
    label: Page — About
    type: file
    path: data/page-about.json
    format: json
    fields:
      - name: sections
        label: Sections
        type: object
        list: true
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: body
            label: Body
            type: text

  - name: page_ethics
    label: Page — Publication ethics
    type: file
    path: data/page-ethics.json
    format: json
    fields:
      - name: sections
        label: Sections
        type: object
        list: true
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: body
            label: Body
            type: text

  - name: page_guidelines
    label: Page — Author guidelines
    type: file
    path: data/page-guidelines.json
    format: json
    fields:
      - name: sections
        label: Sections
        type: object
        list: true
        fields:
          - name: heading
            label: Heading
            type: string
            required: true
          - name: body
            label: Body
            type: text

settings:
  content:
    merge: false
  commit:
    identity: user
